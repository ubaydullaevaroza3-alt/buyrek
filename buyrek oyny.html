<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Бұл не? — 3D бүйрек</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#eaf1f5;--panel:#ffffff;--tx:#12222e;--mut:#5b6e7b;--line:#cbd9e2;--acc:#0b6e7a;--onacc:#fff;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1822;--panel:#16283a;--tx:#e8f1f6;--mut:#92a8b8;--line:#2a4156;--acc:#3cc0cf;--onacc:#06232a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1822;--panel:#16283a;--tx:#e8f1f6;--mut:#92a8b8;--line:#2a4156;--acc:#3cc0cf;--onacc:#06232a;color-scheme:dark}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;overflow:hidden}
#teams{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:8px}
.t{background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:6px 4px;text-align:center;cursor:pointer;font:inherit;color:inherit}
.t b{display:block;font-size:22px;line-height:1.1}
.t span{font-size:12px;color:var(--mut)}
.t.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
#stage{flex:1;min-height:0;position:relative}
#c{width:100%;height:100%;display:block;touch-action:none}
#round{position:absolute;left:12px;top:6px;font-size:13px;color:var(--mut)}
#panel{background:var(--panel);border-top:1px solid var(--line);padding:12px 12px 10px}
#q{font-size:22px;font-weight:700;min-height:30px}
#a{font-size:16px;color:var(--mut);min-height:22px;margin-top:2px}
#a em{color:var(--acc);font-style:normal;font-weight:700}
.row{display:flex;gap:8px;margin-top:10px}
button.b{flex:1;border:1px solid var(--line);background:transparent;color:var(--tx);border-radius:10px;padding:11px 4px;font:inherit;font-size:15px;cursor:pointer}
button.b:disabled{opacity:.35}
button.p{background:var(--acc);color:var(--onacc);border-color:var(--acc);font-weight:700}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
</style>
</head>
<body>
<div id="teams"></div>
<div id="stage"><canvas id="c"></canvas><div id="round"></div></div>
<div id="panel">
  <div id="q"></div>
  <div id="a"></div>
  <div class="row">
    <button class="b" id="bRev">Жауап</button>
    <button class="b" id="b1">+1 қаз.</button>
    <button class="b" id="b2">+2 лат.</button>
    <button class="b" id="b0">0</button>
  </div>
  <div class="row"><button class="b p" id="bNext">Бастау</button></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const P=[
{id:'cortex',kk:'Қыртыс заты',la:'Cortex renalis'},
{id:'medulla',kk:'Милы зат',la:'Medulla renalis'},
{id:'pyr',kk:'Бүйрек пирамидасы',la:'Pyramides renales'},
{id:'papilla',kk:'Бүйрек бүртігі',la:'Papilla renalis'},
{id:'minor',kk:'Кіші тостағаншалар',la:'Calyces renales minores'},
{id:'major',kk:'Үлкен тостағаншалар',la:'Calyces renales majores'},
{id:'pelvis',kk:'Бүйрек түбегі',la:'Pelvis renalis'},
{id:'hilus',kk:'Бүйрек қақпасы',la:'Hilus renalis'},
{id:'ureter',kk:'Несепағар',la:'Ureter'}];
const V=(x,y,z)=>new THREE.Vector3(x,y,z);
const cv=document.getElementById('c'),stage=document.getElementById('stage');
const R=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true});
R.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
const S=new THREE.Scene(),cam=new THREE.PerspectiveCamera(40,1,.1,50);
cam.position.set(0,-.4,6.6);cam.lookAt(0,-.4,0);
S.add(new THREE.AmbientLight(0xffffff,.75));
const dl=new THREE.DirectionalLight(0xffffff,.8);dl.position.set(2,3,4);S.add(dl);
const G=new THREE.Group();S.add(G);
const parts={};
function add(id,geo,color,op,pos,quat){
  const m=new THREE.MeshStandardMaterial({color,transparent:true,opacity:op,roughness:.5,side:THREE.DoubleSide,depthWrite:op>.9});
  const me=new THREE.Mesh(geo,m);me.userData.base=op;
  if(pos)me.position.copy(pos);if(quat)me.quaternion.copy(quat);
  G.add(me);(parts[id]=parts[id]||[]).push(me);return me;
}
// bean-shaped cortex shell
const bg=new THREE.SphereGeometry(1,48,32),pa=bg.attributes.position;
for(let i=0;i<pa.count;i++){
  let x=pa.getX(i)*.9,y=pa.getY(i)*1.3,z=pa.getZ(i)*.65;
  if(x<0)x+=.55*Math.exp(-y*y/.18)*(-x/.9);
  pa.setXYZ(i,x,y,z);
}
bg.computeVertexNormals();
add('cortex',bg,0xd2705f,.25);
const c=V(.1,0,0),Y=V(0,1,0);
function tSurf(d){let t=0;while(t<3){const p=c.clone().addScaledVector(d,t);if((p.x/.9)**2+(p.y/1.3)**2>1)break;t+=.01}return t}
[0,40,80,120,240,280,320].forEach(deg=>{
  const a=deg*Math.PI/180,d=V(Math.cos(a),Math.sin(a),0),T=tSurf(d),tb=T-.14,ta=.32;
  const qIn=new THREE.Quaternion().setFromUnitVectors(Y,d.clone().negate());
  const qOut=new THREE.Quaternion().setFromUnitVectors(Y,d);
  const t0=ta+.12;
  add('pyr',new THREE.ConeGeometry(.2,tb-t0,24),0x8c2f39,1,c.clone().addScaledVector(d,(t0+tb)/2),qIn);
  add('papilla',new THREE.ConeGeometry(.09,.14,16),0xf6d7b8,1,c.clone().addScaledVector(d,ta+.05),qIn);
  add('minor',new THREE.CylinderGeometry(.14,.08,.2,16,1,true),0xf2c230,.7,c.clone().addScaledVector(d,ta+.02),qOut);
});
[70,0,-70].forEach(deg=>{
  const a=deg*Math.PI/180,d=V(Math.cos(a),Math.sin(a),0);
  add('major',new THREE.CylinderGeometry(.08,.1,.3,16),0xe8890c,1,c.clone().addScaledVector(d,.15),new THREE.Quaternion().setFromUnitVectors(Y,d));
});
const pel=add('pelvis',new THREE.SphereGeometry(.22,24,16),0xb85c0f,1,V(-.1,-.08,0));pel.scale.set(1.2,1,.8);
const curve=new THREE.CatmullRomCurve3([V(-.15,-.15,0),V(-.4,-.35,0),V(-.5,-.9,0),V(-.42,-1.6,0),V(-.5,-2.2,0)]);
add('ureter',new THREE.TubeGeometry(curve,40,.06,10),0xa23b10,1);
const hg=new THREE.TorusGeometry(.38,.03,10,40);hg.rotateY(Math.PI/2);
const hl=add('hilus',hg,0x2aa1b3,0,V(-.38,0,0));hl.scale.set(1,1.5,.6);

let sel=[],cur=null;
function focus(id){
  cur=id;
  if(id==='medulla')sel=parts.pyr;
  else if(id==='pyr')sel=[parts.pyr[Math.floor(Math.random()*parts.pyr.length)]];
  else sel=parts[id]||[];
  for(const k in parts)for(const m of parts[k]){
    const on=sel.includes(m);
    m.material.opacity=on?(id==='cortex'?.85:1):m.userData.base*.12;
    m.material.depthWrite=on||m.userData.base>.9;
    m.material.emissive.setRGB(0,0,0);
  }
}
function resetView(){
  cur=null;sel=[];
  for(const k in parts)for(const m of parts[k]){m.material.opacity=m.userData.base;m.material.emissive.setRGB(0,0,0)}
}
let drag=false,lx=0,ly=0;
cv.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;ly=e.clientY;cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{if(!drag)return;G.rotation.y+=(e.clientX-lx)*.01;G.rotation.x=Math.max(-1,Math.min(1,G.rotation.x+(e.clientY-ly)*.01));lx=e.clientX;ly=e.clientY});
['pointerup','pointercancel'].forEach(n=>cv.addEventListener(n,()=>drag=false));
function size(){const w=stage.clientWidth,h=stage.clientHeight;if(!w||!h)return;R.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}
new ResizeObserver(size).observe(stage);size();
const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
(function loop(t){
  if(!drag&&!reduce)G.rotation.y+=.006;
  const k=.3+.25*Math.sin(t*.005);
  sel.forEach(m=>m.material.emissive.setRGB(k,k*.75,0));
  R.render(S,cam);requestAnimationFrame(loop);
})(0);

// game
let sc=[0,0,0,0],ti=0,order=[],qi=-1,shown=false,scored=false,done=false;
const $=id=>document.getElementById(id);
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function render(){
  $('teams').innerHTML=sc.map((s,i)=>`<button class="t${i===ti&&!done?' on':''}" data-i="${i}"><span>${i+1}-топ</span><b>${s}</b></button>`).join('');
  document.querySelectorAll('.t').forEach(b=>b.onclick=()=>{ti=+b.dataset.i;render()});
  const active=qi>=0&&!done;
  ['bRev','b1','b2','b0'].forEach(id=>$(id).disabled=!active);
  $('b1').disabled=$('b2').disabled=$('b0').disabled=!active||scored;
  $('round').textContent=qi>=0&&!done?`${qi+1} / ${order.length}`:'';
}
function reveal(){
  const p=order[qi];shown=true;
  $('a').innerHTML=`<em>${p.kk}</em> — ${p.la}`;
}
$('bRev').onclick=()=>{if(qi>=0)reveal()};
function score(n){if(scored||qi<0)return;sc[ti]+=n;scored=true;reveal();ti=(ti+1)%4;render()}
$('b1').onclick=()=>score(1);$('b2').onclick=()=>score(2);$('b0').onclick=()=>score(0);
$('bNext').onclick=()=>{
  if(done){sc=[0,0,0,0];ti=0;qi=-1;done=false;order=[];resetView();$('q').textContent='';$('a').textContent='';$('bNext').textContent='Бастау';render();return}
  if(qi<0)order=shuffle(P);
  if(qi>=order.length-1){
    done=true;resetView();
    const m=Math.max(...sc),w=sc.map((s,i)=>s===m?`${i+1}-топ`:null).filter(Boolean).join(', ');
    $('q').textContent=`Жеңімпаз: ${w} (${m} ұпай)`;$('a').textContent='';
    $('bNext').textContent='Қайта бастау';render();return;
  }
  qi++;scored=false;shown=false;focus(order[qi].id);
  $('q').textContent='Бұл не?';$('a').textContent='';
  $('bNext').textContent=qi===order.length-1?'Нәтиже':'Келесі';
  render();
};
$('q').textContent='Төрт топ кезекпен жауап береді';
render();
</script>
</body>
</html>
